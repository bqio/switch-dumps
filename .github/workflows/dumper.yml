name: Run dump script and publish release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: Build Docker Image
        run: docker build -t dump-script:latest .

      - name: Run Docker Image
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/output \
            --entrypoint bash \
            dump-script:latest \
            -c "echo '=== Start torrent download ===' && aria2c --bt-metadata-only=false --bt-save-metadata=false --summary-interval=10 --seed-time=0 \"\$MAGNET_LINK\" && echo '=== Download complete. Start dumper ===' && xz -d -c *.xml.xz | python dump.py - 1605 /output/result.json"

      - name: Generate Tag Name
        id: tag
        run: echo "tag_name=v$(date +'%Y.%m.%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag_name }}" \
            --title "Dump ${{ steps.tag.outputs.tag_name }}" \
            --notes "Automated data dump" \
            ./result.json
